# ============================================================
# 语义地图构建配置文件 (✅ 适配 DownTown)
# ============================================================

# 相机参数
camera:
  fx: 320
  fy: 320
  fov: 90  # 视场角(度)

# 地图参数
map:
  size: 80  #  40✖40地图 0.5m/像素
  resolution: 0.5  # 分辨率(米/格子)
  layers:
    - ground     # 地面层
    - mid        # 中层
    - background # 背景层

# 类别配置 (✅ 适配 DownTown 场景)
classes:
  ground:
    - car
    - grass
    
    # - person
  mid:
    # - traffic_light
    # - stop_sign
    # - bench
    - tree
  background:
    - building
    - lake
    
    # - truck
    # - bus

# 投影参数
projection:
  depth_min: 0.1
  depth_max: 200.0  # ✅ 必须大于 50m
  sample_step: 500
  pitch_correction: true
  stride_px: 2

# 融合参数
fusion:
  confidence_threshold: 0.25
  observation_weight: 0.3
  min_observations: 1

fusion_weights:
  building: 1.0
  road: 1.0
  lake: 1.3
  grass: 1.3
  tree: 0.9


# ✅ 新增：物体关联阈值 (米)
association_thresholds:
  building: 10.0    # 25米内的 building 视为同一个
  car : 3.0
  tree: 4.0         # ✅ 新增: 树木4米
  default: 2.0      # 其他物体 (car, person, bench...)

# 后处理参数
postprocess:
  morphology_kernel_size: 3
  smooth_sigma: 1.0
  building_min_area: 50
  road_dilation_iter: 3

# ============================================================
# ✅ 新增: LLM 描述生成器配置
# ============================================================
llm:
  # 留空即读取环境变量 OPENAI_API_KEY，请勿把真实密钥提交进仓库
  api_key: ""
  base_url: "https://api.openai.com/v1"
  # 任何 OpenAI 格式的模型均可；gpt-4o-mini 兼顾成本与效果
  llm_model: "gpt-4o-mini"
  # (注意: gpt-4o-mini 本身就是 VLM, 可以处理图像)
  # (如果您的 API 支持, vlm_model 可以和 llm_model 相同)
  vlm_model: "gpt-4o-mini"
  # 只对下列类别调用 LLM 生成语义描述（留空数组可完全关闭 LLM）
  enrich_categories:
    - building

  
